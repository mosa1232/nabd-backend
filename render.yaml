services:
  - type: web
    name: nabd-backend
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        value: "sqlite:///./nabd.db"
      - key: ALLOWED_UNIVERSITY_DOMAINS
        value: ""
      # Set these in the Render dashboard after the first deploy, once you
      # know the service's real onrender.com URL (see README "Deploying").
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
