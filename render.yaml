services:
  - type: web
    name: nabd-backend
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    # --proxy-headers: Render and Cloudflare sit in front of the app, so the real
    # scheme (https) and visitor IP arrive in X-Forwarded-* headers. Without
    # trusting them, password-reset and Google sign-in links would be built
    # with http:// and the activity log would record the proxy's IP.
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'"
    healthCheckPath: /health
    envVars:
      # Pin the interpreter: Render otherwise uses its newest default Python,
      # which can lack prebuilt wheels for the pinned dependencies.
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: JWT_SECRET
        generateValue: true
      - key: DEBUG
        value: "false"
      # Set to your own email so only you can claim admin on a fresh database.
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      # Render's free disk is wiped on every deploy, so a SQLite file here
      # would lose every account, booklet and sold code on each push. This
      # points at the managed Postgres defined at the bottom of this file.
      - key: DATABASE_URL
        fromDatabase:
          name: nabd-db
          property: connectionString
      - key: ALLOWED_UNIVERSITY_DOMAINS
        value: ""
      # Password reset needs these to actually deliver a link. Until they're
      # set the feature reports itself as unavailable rather than silently
      # failing. See .env.example for host/port per provider.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      # The instance disk is wiped on every deploy, so uploads are kept in the
      # database ("db"): photos and small PDFs (15 MB each) survive every
      # deploy with nothing else to set up. For large lecture videos switch to
      # "s3" and fill in the S3_* values below (Cloudflare R2 is the cheap
      # choice — lecture video is mostly egress, which R2 doesn't charge for).
      - key: STORAGE_BACKEND
        value: "db"
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      # The AI assistant and the doctors' question generator call the Claude
      # API (console.anthropic.com → API keys). Leave it empty and the AI
      # features simply report themselves as unavailable. Usage is billed to
      # that key's account, and uploaded files are sent to Anthropic.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AI_MODEL
        value: "claude-sonnet-5-5"
      # Set these in the Render dashboard after the first deploy, once you
      # know the service's real onrender.com URL (see README "Deploying").
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false

databases:
  - name: nabd-db
    plan: free
    databaseName: nabd
    user: nabd
